# Deployment template: replace image and create Secret before applying.
# BFF must bind a runtime to one explicit Pod DNS name, NOT round-robin this service.
apiVersion: v1
kind: Service
metadata:
  name: genslide-langgraph
spec:
  clusterIP: None
  selector:
    app: genslide-langgraph
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: genslide-langgraph
spec:
  serviceName: genslide-langgraph
  replicas: 2
  selector:
    matchLabels:
      app: genslide-langgraph
  template:
    metadata:
      labels:
        app: genslide-langgraph
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: genslide-langgraph:0.1.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          env:
            - name: GENSLIDE_ENV
              value: production
          envFrom:
            - secretRef:
                name: genslide-langgraph-config
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 512Mi
