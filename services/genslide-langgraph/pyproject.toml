[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "genslide-langgraph"
version = "0.1.0"
description = "Request-bound multi-user guided content API (langgraph)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "anyio==4.15.1",
  "python-multipart==0.0.32",
  "python-pptx==1.0.2",
  "python-docx==1.2.0",
  "pypdf==6.8.0",
  "langgraph==0.6.11",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/genslide_langgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
