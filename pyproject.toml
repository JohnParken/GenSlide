[project]
name = "genslide"
version = "0.1.0"
description = "GenSlide AI writing workbench and AgentScope content service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Current assistant demo and retained legacy workbench.
    "streamlit==1.34.0",
    "nest_asyncio==1.6.0",
    # Shared helpers used by frontend/legacy/autonomous_agent.py.
    # Note: genslide_agentscope imports no agentscope symbols in this path, so the
    # agentscope framework itself stays in the service environment only.
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "python-pptx==1.0.2",
    "python-docx==1.2.0",
    "pypdf==6.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["frontend/tests"]
python_files = ["test_*.py"]
pythonpath = [".", "backend"]


[tool.uv]
default-groups = ["dev"]
