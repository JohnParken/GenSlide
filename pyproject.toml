[project]
name = "genslide"
version = "0.1.0"
description = "AI-powered presentation generation system"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "python-dotenv==1.2.1",
    "pillow==10.3.0",
    "lxml==5.2.2",
    "XlsxWriter==3.2.0",
    "python-pptx==0.6.23",
    "gpt4all==2.7.0",
    "Flask==2.2.5",
    "Flask-Cors==4.0.0",
    "streamlit==1.34.0",
    "langchain_openai==0.3.35",
    "langchain_community==0.3.31",
    "langgraph==0.6.11",
    "pypdf==6.8.0",
    "python-docx==1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]


[tool.uv]
default-groups = ["dev"]
