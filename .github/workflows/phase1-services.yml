name: GenSlide CI
on:
  push:
    paths: ['backend/**', 'test-tools/**', 'frontend/**', 'contracts/**', 'scripts/**', 'pyproject.toml', 'uv.lock', '.github/workflows/phase1-services.yml']
  pull_request:
    paths: ['backend/**', 'test-tools/**', 'frontend/**', 'contracts/**', 'scripts/**', 'pyproject.toml', 'uv.lock', '.github/workflows/phase1-services.yml']
permissions:
  contents: read
jobs:
  tl-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test-tools/tl-proxy/package-lock.json
      - run: npm ci
        working-directory: test-tools/tl-proxy
      - run: npm run typecheck
        working-directory: test-tools/tl-proxy
      - run: npm run build
        working-directory: test-tools/tl-proxy
      - run: npm test
        working-directory: test-tools/tl-proxy
  agentscope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
          python-version: '3.12'
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run --locked pytest -q
        working-directory: backend
      - run: uv build
        working-directory: backend
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run pytest -q
